#!/usr/sbin/nft -f

flush ruleset

table inet anti_abuse {
    set src_quarantine4 {
        type ipv4_addr
        flags timeout
    }

    set src_quarantine6 {
        type ipv6_addr
        flags timeout
    }

    set dst_shun4 {
        type ipv4_addr
        flags timeout
    }

    set blocked_dst4 {
        type ipv4_addr
        flags interval
        auto-merge
    }

    set dst_shun6 {
        type ipv6_addr
        flags timeout
    }

    set cloudflare_dst4 {
        type ipv4_addr
        flags interval
        auto-merge
    }

    set cloudflare_dst6 {
        type ipv6_addr
        flags interval
        auto-merge
    }

    set cdn_dst4 {
        type ipv4_addr
        flags interval
        auto-merge
    }

    set cdn_dst6 {
        type ipv6_addr
        flags interval
        auto-merge
    }

    set blocked_tcp_ports {
        type inet_service
        flags interval
        elements = {
            23, 111, 445,
            2222,
            2375, 2376,
            2053, 2096,
            9200, 9300,
            11211, 27017
        }
    }

    set blocked_smtp_ports {
        type inet_service
        elements = { 25, 465, 587, 2525 }
    }

    set blocked_inbound_telnet_ports {
        type inet_service
        elements = { 23, 2323 }
    }

    set management_bruteforce_ports {
        type inet_service
        flags interval
        elements = { 22, 23, 2323, 3389, 5900-5999 }
    }

    set cloudflare_scan_ports {
        type inet_service
        elements = {
            80, 443,
            8080, 8443, 8880,
            2052, 2053,
            2082, 2083,
            2086, 2087,
            2095, 2096,
            2408
        }
    }

    chain input {
        type filter hook input priority filter; policy accept;

        iif lo accept
        ct state established,related accept

        ip saddr @src_quarantine4 counter drop
        ip6 saddr @src_quarantine6 counter drop

        tcp dport @blocked_inbound_telnet_ports counter drop

        # Optional strict mode for unmanaged images:
        # tcp dport @management_bruteforce_ports counter drop
    }

    chain output {
        type filter hook output priority filter; policy accept;

        oif lo accept
        ct state established,related accept

        ip saddr @src_quarantine4 counter drop
        ip6 saddr @src_quarantine6 counter drop
        ip daddr @dst_shun4 counter drop
        ip daddr @blocked_dst4 counter drop
        ip6 daddr @dst_shun6 counter drop

        tcp dport @blocked_smtp_ports counter drop
        tcp dport @blocked_tcp_ports counter drop

        meta l4proto { tcp, udp } queue num 0-3 fanout,bypass
        ip protocol icmp queue num 0-3 fanout,bypass
        ip6 nexthdr ipv6-icmp queue num 0-3 fanout,bypass
    }

    chain forward {
        type filter hook forward priority filter; policy accept;

        ct state established,related accept

        ip saddr @src_quarantine4 counter drop
        ip6 saddr @src_quarantine6 counter drop
        ip daddr @dst_shun4 counter drop
        ip daddr @blocked_dst4 counter drop
        ip6 daddr @dst_shun6 counter drop

        tcp dport @blocked_smtp_ports counter drop
        tcp dport @blocked_tcp_ports counter drop

        meta l4proto { tcp, udp } queue num 0-3 fanout,bypass
        ip protocol icmp queue num 0-3 fanout,bypass
        ip6 nexthdr ipv6-icmp queue num 0-3 fanout,bypass
    }
}

table bridge anti_abuse_bridge {
    set src_quarantine4 {
        type ipv4_addr
        flags timeout
    }

    set src_quarantine6 {
        type ipv6_addr
        flags timeout
    }

    set dst_shun4 {
        type ipv4_addr
        flags timeout
    }

    set blocked_dst4 {
        type ipv4_addr
        flags interval
        auto-merge
    }

    set dst_shun6 {
        type ipv6_addr
        flags timeout
    }

    chain forward {
        type filter hook forward priority filter; policy accept;

        ether type ip ip saddr @src_quarantine4 counter drop
        ether type ip6 ip6 saddr @src_quarantine6 counter drop
        ether type ip ip daddr @dst_shun4 counter drop
        ether type ip ip daddr @blocked_dst4 counter drop
        ether type ip6 ip6 daddr @dst_shun6 counter drop

        ether type ip ip protocol { tcp, udp } queue num 0-3 fanout,bypass
        ether type ip ip protocol icmp queue num 0-3 fanout,bypass
        ether type ip6 ip6 nexthdr { tcp, udp } queue num 0-3 fanout,bypass
        ether type ip6 ip6 nexthdr ipv6-icmp queue num 0-3 fanout,bypass
    }
}
